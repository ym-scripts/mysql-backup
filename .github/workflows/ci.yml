name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]   # macOS covers bash 3.2
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck -S warning mysql-backup.sh test/run.sh test/bin/_stub
      - run: bash test/run.sh

  e2e:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["mysql:8.4", "mariadb:11"]
    services:
      db:
        image: ${{ matrix.image }}
        env: { MYSQL_ROOT_PASSWORD: pw, MYSQL_DATABASE: shop, MARIADB_ROOT_PASSWORD: pw, MARIADB_DATABASE: shop }
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -ppw || mariadb-admin ping -h 127.0.0.1 -ppw" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: mysql://root:pw@127.0.0.1:3306/shop
      MYSQL_PWD: pw
    steps:
      - uses: actions/checkout@v4
      - name: Back up, break, restore, verify
        run: |
          q() { mysql -h 127.0.0.1 -u root shop -Nse "$1"; }
          q "create table t (id int primary key); insert into t with recursive s(n) as (select 1 union all select n + 1 from s where n < 1000) select n from s;"
          file=$(./mysql-backup.sh --dir ./backups --keep 0)
          q "drop table t"
          ./mysql-backup.sh restore "$file" --yes
          test "$(q 'select count(*) from t')" = 1000
          ./mysql-backup.sh list --dir ./backups
